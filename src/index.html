<!DOCTYPE html>
<html>
  <head>
    <script defer src="./script/main.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <link rel="stylesheet" href="./style/index.css" />
    <link rel="stylesheet" href="./style/matrix.css" />
    <link rel="stylesheet" href="./style/sequence.css" />
    <link rel="stylesheet" href="./style/buffer.css" />
    <link rel="stylesheet" href="./style/breach.css" />
  </head>

  <body>
    <div id="app" x-data="{genData:generateData(), currentlyHovering:''}">
      <div id="btnDisplay">
        <button id="refreshButton" x-on:click="genData=generateData()">
          Restart
        </button>
      </div>

      <!-- Display for Button -->
      <div id="breachTime">
        <span>Breach Time Remaning</span>
      </div>

      <!-- Code matrix is 6x6 -->
      <div id="matrixDisplay">
        <table id="codeMatrix">
          <template x-for="row in 6">
            <tr>
              <template x-for="column in 6">
                <!-- 
                This horribleness is courtesy of the Alpine.js maintainers, 
                who to my knowledge think indexing from 1 in loops is normal
              -->
                <th
                  x-text="genData['matrix'][row-1][column-1]['cell']"
                  x-on:click="
                    genData['matrix'][row-1][column-1]['state'] != 'clickedTrue' ?
                    (
                        clickedCode(genData['matrix'][row-1][column-1], row-1, column-1),
                        genData['matrix'][row-1][column-1]['state']='clickedTrue',
                        genData['matrix'][row-1][column-1]['cell']='[ ]'

                    )
                    :
                    {}
                "
                  x-on:mouseover="currentlyHovering=genData['matrix'][row-1][column-1]['cell']"
                  x-on:mouseleave="currentlyHovering=''"
                  x-bind:class="genData['matrix'][row-1][column-1]['state']"
                  class="unselectable"
                ></th>
              </template>
            </tr>
          </template>
        </table>
      </div>

      <!-- Display for Buffer -->
      <div id="bufferDisplay">
        <span id="title">Buffer</span>
        <br />
        <span id="bufferInput" x-text="currentlyHovering"></span>
      </div>

      <!-- Display for Sequences -->
      <div id="sequenceDisplay">
        <span id="title">Sequence Required to Upload</span>

        <!-- Display with Sequences -->
        <div id="sequenceList">
          <template x-for="codeIndex in genData['codes'].length">
            <div class="sequence">
              <template
                x-for="code in genData['codes'][codeIndex-1]['codeValue'].length"
              >
                <span
                  class="codeDisplay unselectable"
                  x-text="genData['codes'][codeIndex-1]['codeValue'][code-1]"
                  x-on:mouseover="currentlyHovering=genData['codes'][codeIndex-1]['codeValue'][code-1]"
                  x-on:mouseleave="currentlyHovering=''"
                ></span>
              </template>
            </div>
          </template>
        </div>

        <!-- Dispay with Rewards -->
        <div id="rewardList">
          <template x-for="rewardIndex in genData['codes'].length">
            <div class="reward">
              <span
                class="rewardDisplay unselectable"
                x-text="genData['codes'][rewardIndex-1]['rewardValue']"
              ></span>
            </div>
          </template>
        </div>
      </div>
    </div>
  </body>
</html>
